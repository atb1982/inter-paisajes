<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inter-paisajes Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --band:#595959; --band-ink:#ffffff; --band-soft:#d9d9d9;
  --bg:#f2f2f0; --panel:#e9e9e6; --card:#ffffff; --ink:#2b2b2b; --muted:#6e6e6e; --line:#d3d3cf;
  --accent:#d4561f; --green:#6f8f2f; --chip:#ffffff; --chip-on:#595959; --chip-on-ink:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --band:#3d3d3d; --bg:#232323; --panel:#2b2b2b; --card:#303030; --ink:#ececec; --muted:#a6a6a6; --line:#444;
    --chip:#303030; --chip-on:#ececec; --chip-on-ink:#232323; --accent:#e7703c; --green:#9bbb57; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --band:#3d3d3d; --bg:#232323; --panel:#2b2b2b; --card:#303030; --ink:#ececec; --muted:#a6a6a6; --line:#444;
  --chip:#303030; --chip-on:#ececec; --chip-on-ink:#232323; --accent:#e7703c; --green:#9bbb57; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Lato,"Helvetica Neue",Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.titleband{background:var(--band);color:var(--band-ink);text-align:center;padding:18px 16px 14px}
.titleband h1{margin:0;font-weight:700;font-size:clamp(28px,4.6vw,56px);line-height:1.05;letter-spacing:-.5px}
.titleband .sub{font-style:italic;font-size:clamp(14px,1.8vw,22px);margin-top:6px}
.titleband .by{font-size:13px;color:var(--band-soft);margin-top:6px}
.navband{position:sticky;top:0;z-index:30;background:var(--band);color:var(--band-ink);display:flex;gap:10px;align-items:center;padding:8px 18px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.15)}
.navband .mini{font-weight:700;font-size:15px;opacity:0;transition:opacity .2s;white-space:nowrap}
.navband.stuck .mini{opacity:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button,.navbtn{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;padding:5px 14px;cursor:pointer;border-radius:2px;font-size:13px}
.tabs button.on{background:#fff;color:#3a3a3a;border-color:#fff;font-weight:700}
.navband .sp{flex:1}
.lang{display:flex;border:1px solid rgba(255,255,255,.55);border-radius:2px;overflow:hidden}
.lang button{background:transparent;border:none;color:#fff;padding:5px 10px;cursor:pointer;font-size:12px;letter-spacing:.05em}
.lang button.on{background:#fff;color:#3a3a3a;font-weight:700}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:2px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--band);color:#fff;border-color:var(--band)}
.btn.small{padding:3px 9px;font-size:12px}
main{display:none} main.on{display:block}
.layout{display:grid;grid-template-columns:280px 1fr}
aside.filters{border-right:1px solid var(--line);padding:16px;position:sticky;top:46px;height:calc(100vh - 46px);overflow:auto;background:var(--panel)}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 6px;font-weight:700;display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:2px;padding:3px 9px;font-size:12px;cursor:pointer;user-select:none}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.chip .n{opacity:.6;margin-left:5px;font-size:11px}
.sw{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
.role-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
input[type=search],select,textarea,input[type=text]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:2px;background:var(--card)}
details.key{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);padding:8px 10px;margin-bottom:6px}
details.key summary{cursor:pointer;font-weight:700;font-size:13px}
details.key dl{margin:8px 0 0;font-size:12px}
details.key dt{font-weight:700;margin-top:7px}
details.key dd{margin:1px 0 0;color:var(--muted)}
details.key h4{margin:12px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.qbtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:17px;height:17px;font-size:10px;line-height:15px;padding:0;cursor:pointer;color:var(--muted)}
.content{padding:18px 22px 60px;min-width:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .count{color:var(--muted)}
.bar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.bar select{width:auto}
.section-h{font-size:20px;font-weight:300;margin:24px 0 10px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:4px}
.section-h small{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,170px),1fr));gap:10px}
.card{background:var(--card);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative;display:flex;flex-direction:column}
.card .img{aspect-ratio:4/3;position:relative;overflow:hidden;min-height:0}
.card .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .img img{transform:scale(1.04)}
.card .meta{padding:7px 9px 9px;font-size:12px}
.card .id{font-weight:700;font-size:11px;letter-spacing:.04em}
.card .suj{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;background:var(--panel);margin:4px 3px 0 0;border-radius:2px}
.tag.r-Andes{background:#d4561f;color:#fff}
.tag.r-Appalachia{background:#6f8f2f;color:#fff}
.badge{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap}
.badge span{background:rgba(40,40,40,.78);color:#fff;font-size:10px;padding:1px 6px;border-radius:2px}
.badge span.role{background:#fff;color:#333;border:1px solid rgba(0,0,0,.2)}
.add{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.95);color:#222;border:none;border-radius:2px;padding:2px 8px;font-size:12px;cursor:pointer;opacity:0;transition:opacity .15s}
.card:hover .add{opacity:1}
.favbtn{position:absolute;bottom:6px;left:6px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:#222;font-size:17px;line-height:1;cursor:pointer;opacity:0;transition:opacity .15s}
.favbtn.on{opacity:1;color:#d98a00}
.card:hover .favbtn,.favbtn:focus-visible{opacity:1}
@media (hover:none){.favbtn{opacity:1}}
@media (hover:none){.add{opacity:1}}
.dot-edit{position:absolute;bottom:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 18px}
.stat{background:var(--card);padding:10px 14px}
.stat b{font-size:26px;font-weight:300;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
/* panels */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:16px}
.pcard{background:var(--card);box-shadow:var(--shadow);padding:0 0 12px;border-top:4px solid var(--band)}
.pcard.fav{border-top-color:var(--accent)}
.pcard.st-probado{border-top-color:#c9a227}
.pcard.st-elegido{border-top-color:var(--green)}
.pcard.st-descartado{opacity:.45}
.phead{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.phead .pid{font-size:18px;font-weight:700;cursor:pointer;border-bottom:1px dotted var(--muted)}
.phead .pid:hover,.phead .pid:focus-visible{color:var(--accent);border-bottom-color:var(--accent);outline:none}
.phead .hilo{font-size:12px;font-style:italic;color:var(--muted)}
.phead .sp{flex:1}
.ring{display:flex;height:190px;margin:0 12px}
.ring .a{position:relative;flex:1;overflow:hidden;cursor:pointer}
.ring .a img{width:100%;height:100%;object-fit:cover;display:block}
.ring .a .l{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:10.5px;padding:14px 6px 4px}
.ring .gap{width:22px;background:repeating-linear-gradient(90deg,var(--panel) 0 2px,transparent 2px 3px);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;font-weight:700}
.ringback{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin:5px 12px 0}
.ringback .ln{flex:1;height:1px;border-top:1px dashed var(--line)}
.why{font-size:12px;color:var(--muted);margin:8px 12px 8px}
.pfoot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 12px}
.pfoot select{width:auto;padding:3px 6px;font-size:12px}
.pfoot input{flex:1;min-width:120px;padding:4px 7px;font-size:12px}
.help{font-size:13px;color:var(--muted);max-width:900px;margin:0 0 14px}
/* builder */
.builder{background:var(--card);border-top:4px solid var(--band);box-shadow:var(--shadow);padding:14px;margin-bottom:18px}
.builder h2{margin:0;font-weight:300;font-size:22px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.slot{aspect-ratio:1;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative;overflow:hidden;background:var(--panel)}
.slot img{width:100%;height:100%;object-fit:cover}
.slot .x{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:2px;cursor:pointer;font-size:12px;padding:1px 6px}
.slot .mv{position:absolute;bottom:5px;left:5px;right:5px;display:flex;justify-content:space-between}
.slot .mv button{background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:2px;cursor:pointer;font-size:12px;padding:1px 7px}
.slot .cap{position:absolute;top:5px;left:5px;right:30px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:1px 6px;border-radius:2px}
.checks{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.checks .ok{color:var(--green);font-weight:700} .checks .no{color:var(--accent);font-weight:700}
/* modal */
dialog{border:none;border-radius:0;padding:0;max-width:min(1100px,94vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(30,30,30,.7)}
.dlg{display:grid;grid-template-columns:1.4fr 1fr;min-height:420px}
.dlg .pic{background:#1b1b1b;display:flex;align-items:center;justify-content:center}
.dlg .pic img{max-width:100%;max-height:80vh;display:block}
.dlg .info{padding:0 0 18px;overflow:auto;max-height:86vh}
.dlg .ihead{background:var(--band);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;gap:8px;align-items:start}
.dlg .ihead h2{margin:0;font-size:22px}
.dlg .ihead .s{font-style:italic;color:#e5e5e5}
.dlg .ihead .navbtn{font-size:12px}
.dlg .body{padding:4px 16px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:12.5px;margin:10px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.form{display:grid;grid-template-columns:110px 1fr;gap:7px 10px;align-items:center;font-size:12.5px;margin-top:8px}
.form label{color:var(--muted)}
.rolehelp{font-size:11.5px;color:var(--muted);grid-column:2}
.pal{display:flex;gap:2px;margin-top:3px} .pal span{width:24px;height:14px;border:1px solid rgba(0,0,0,.1)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#3a3a3a;color:#fff;padding:8px 14px;border-radius:2px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line)}

details.fg{border-bottom:1px solid var(--line);padding:6px 0}
details.fg>summary{cursor:pointer;list-style:none;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
details.fg>summary::before{content:"+";width:12px;color:var(--muted)}
details.fg[open]>summary::before{content:"–"}
details.fg>summary .act{background:var(--accent);color:#fff;border-radius:2px;font-size:10px;padding:0 5px;letter-spacing:0}
details.fg .chips{margin:6px 0 4px}
.fsec{font-size:12px;font-weight:900;margin:16px 0 2px;color:var(--ink);display:flex;align-items:center;gap:7px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.fsec .secic{flex:none;color:var(--band)}
.dlg .sec{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:12px 0 2px;font-weight:700}
.gl-wrap{max-width:1000px}
.gl-cite{font-size:13px;color:var(--muted);border-left:4px solid var(--accent);padding:6px 12px;background:var(--card);margin:0 0 16px}
.gl-h{font-size:22px;font-weight:300;border-bottom:1px solid var(--line);margin:22px 0 8px;padding-bottom:4px}
.gl-item{display:grid;grid-template-columns:230px 1fr;gap:4px 16px;padding:9px 0;border-bottom:1px solid var(--line)}
.gl-term{font-weight:700}
.gl-term small{display:block;font-weight:400;font-style:italic;color:var(--muted)}
.gl-def{color:var(--ink)}
.gl-meta{margin-top:4px;font-size:11.5px;color:var(--muted)}
.gl-meta a{color:var(--accent);cursor:pointer;text-decoration:underline}
@media (max-width:860px){.gl-item{grid-template-columns:1fr}}
.randbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0 0;padding:10px;background:var(--panel)}
.randbar label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.randbar select{width:auto}
.slot .lk{position:absolute;top:5px;right:34px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:2px;cursor:pointer;font-size:12px;padding:1px 6px}
.slot.locked{outline:3px solid var(--accent);outline-offset:-3px}
.dlnote{font-size:12px;color:var(--muted);margin:6px 12px 0}
footer{background:var(--band);color:var(--band-soft);text-align:center;font-size:12px;padding:10px 16px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside.filters{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .pgrid{grid-template-columns:1fr}
  .ring{height:130px}
  .dlg{grid-template-columns:1fr}
  .content{padding:14px 16px 60px}
  .strip{height:80px}
  .navband{padding:8px 16px}
  .navband .mini{display:none}
}

.haiku{margin:8px 12px 0;padding-left:10px;border-left:3px solid var(--line);font-style:italic;font-size:13.5px;line-height:1.45;white-space:pre-line}
dialog.wide{max-width:min(1500px,97vw)}
.pv{display:flex;flex-direction:column;max-height:94vh}
.pv .ph{background:var(--band);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pv .ph h2{margin:0;font-size:22px}
.pv .ph .s{font-style:italic;color:#e5e5e5;font-size:13px}
.pv .ph .acts{display:flex;gap:6px;flex-wrap:wrap}
.pv .ph .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.pv .ph .btn:disabled{opacity:.35;cursor:default}
.pv .pbody{overflow:auto;padding:14px 16px}
.pv .screen{background:#111;padding:14px;display:flex;justify-content:center}
.pv .pstrip{display:flex;align-items:stretch;width:100%}
.pv .pstrip figure{margin:0;position:relative;min-width:0;background:#1b1b1b;cursor:zoom-in}
.pv .pstrip figure img{display:block;width:100%;height:auto;object-fit:cover}
.pv .pgap{width:18px;flex:none;background:repeating-linear-gradient(90deg,#3a3a3a 0 2px,transparent 2px 3px);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#9a9a9a}
.pv .pstrip.solo{max-width:none!important}
.pv .pstrip.solo figure:not(.zoom),.pv .pstrip.solo .pgap{display:none}
.pv .pstrip.solo figure.zoom{flex:1 1 100%!important;cursor:zoom-out}
.pv .pstrip.solo figure.zoom img{aspect-ratio:auto!important;max-height:68vh;object-fit:contain}
.pv .pback{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
#helpdlg{max-width:min(720px,94vw)}
#helpbtn{width:30px;padding:4px 0;border-radius:50%;font-weight:700;text-align:center}
.helpbox{display:flex;flex-direction:column;max-height:88vh}
.helphead{display:flex;justify-content:space-between;align-items:center;background:var(--band);color:#fff;padding:12px 16px}
.helphead h2{margin:0;font-size:20px}.helphead .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.helpbody{padding:14px 20px;overflow:auto;font-size:14px;line-height:1.55}
.helpbody p{margin:0 0 12px}.hlist{list-style:none;margin:0;padding:0}.hlist li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.hlist li svg{flex:none;color:var(--band);margin-top:2px}.hlist b{display:block}.hlist span{color:var(--muted)}
.helphead .hic{display:flex}.helphead h2{flex:1}.helphead{gap:12px}
.helpfoot{padding:10px 16px 14px;text-align:right;border-top:1px solid var(--line)}
#srcdlg{max-width:560px}
.srcbox{padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.srcbox h3{margin:0}.srcbox p{margin:0}
.srcmsg{color:var(--accent);font-size:12.5px;min-height:16px}
.pv figcaption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;font-size:12px;padding:20px 10px 6px;display:flex;justify-content:space-between;gap:8px;align-items:flex-end}
.pv figcaption button{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:2px;cursor:pointer;font-size:11px;padding:1px 7px;white-space:nowrap}
.pv .phl{flex:1;min-width:260px}
.pv .hk{font-style:italic;font-size:15px;line-height:1.5;white-space:pre-line;margin:8px 0 0;color:#f4f4f4}
.pv .hkedit{display:block;width:100%;max-width:520px;margin:12px auto 0;font-size:13px}
.pv .hkbar{display:flex;gap:8px;justify-content:center;margin-top:6px}
.pv .pchecks{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
.pv .pvmsg{min-height:18px;text-align:center;color:var(--accent);font-size:12.5px;margin-top:6px}
@media(max-width:700px){.pv .pgap{width:8px;font-size:0}}
</style>
</head>
<body>
<div class="titleband">
  <h1>Inter-paisajes | Inter-landscapes</h1>
  <div class="sub" data-t="subtitle"></div>
  <div class="by" data-t="byline"></div>
</div>
<div class="navband" id="navband">
  <span class="mini">Inter-paisajes</span>
  <nav class="tabs">
    <button data-tab="corpus" class="on" data-t="tab_corpus"></button>
    <button data-tab="sug" data-t="tab_sug"></button>
    <button data-tab="mios" data-t="tab_mine"></button>
    <button data-tab="glos" data-t="tab_glos"></button>
  </nav>
  <span class="sp"></span>
  <button class="navbtn" id="exp" data-t="export"></button>
  <label class="navbtn" style="cursor:pointer"><span data-t="import"></span><input type="file" id="imp" accept=".json" hidden></label>
  <div class="lang"><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
  <button class="navbtn" id="helpbtn" aria-label="Help" title="Help">?</button>
  <button class="navbtn" id="theme" aria-label="Theme">◐</button>
</div>

<main id="corpus" class="on">
  <div class="layout">
    <aside class="filters" id="filters"></aside>
    <section class="content">
      <div class="stats" id="stats"></div>
      <div class="bar">
        <input type="search" id="q" style="max-width:340px">
        <label><span data-t="sort"></span> <select id="sort"></select></label>

function renderFilters(){
  const keyOpen=$('#keybox')&&$('#keybox').open;
  let h=keyHTML(),sec='';
  const A=all();
  FIELDS.forEach(f=>{
    if(f.sec!==sec){sec=f.sec;h+=`<div class="fsec">${secIcon(sec)}<span>${t('sec_'+sec)}</span></div>`;}
    const c={};A.forEach(x=>fget(f,x).forEach(v=>{if(v)c[v]=(c[v]||0)+1;}));
    const keys=Object.keys(c).sort(f.order?((a,b)=>f.order.indexOf(a)-f.order.indexOf(b)):((a,b)=>c[b]-c[a]));
    const act=F[f.k].size;
    h+=`<details class="fg" data-fk="${f.k}" ${OPEN.has(f.k)||act?'open':''}><summary>${esc(flab(f))}${f.computed?' ·':''}${act?` <span class="act">${act}</span>`:''}${f.k==='uso'?' <button class="qbtn" id="openkey" title="'+esc(t('key'))+'">?</button>':''}</summary><div class="chips">`+keys.map(v=>{
      const pre=f.k==='familia'?`<i class="sw" style="background:${FAMCOL[v]||'#999'}"></i>`:f.k==='uso'?dot(v):'';
      const tip=DESC[f.k]?DESC[f.k][LANG][v]:'';
      return `<span class="chip ${F[f.k].has(v)?'on':''}" data-k="${f.k}" data-v="${esc(v)}" title="${esc(tip||'')}">${pre}${esc(f.raw?v:vl(f.k,v))}<span class="n">${c[v]}</span></span>`;}).join('')+'</div>';
    if(f.k==='elemento')h+=`<label style="font-size:12px;color:var(--muted);display:flex;gap:6px;margin:2px 0 4px"><input type="checkbox" id="eprin" ${elemPrincipal?'checked':''}> ${t('only_main')}</label>`;
    h+='</details>';
  });
  h+=`<div class="fsec">${t('changes')}</div><div class="chips" style="margin-top:6px"><span class="chip ${F.fav.has('si')?'on':''}" data-k="fav" data-v="si">★ ${t('favs_only')}<span class="n">${favN()}</span></span><span class="chip ${F.editado.has('si')?'on':''}" data-k="editado" data-v="si">${t('edited')}<span class="n">${Object.keys(store.ediciones).length}</span></span></div><button class="btn small" id="favcsv" style="margin-top:8px">${t('fav_csv')}</button>`;
  $('#filters').innerHTML=h;
  $('#favcsv').onclick=()=>{const ids=Object.keys(store.favs).filter(k=>store.favs[k]&&BASE[k]).sort();if(!ids.length){toast(t('fav_none'));return;}const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';download('interpaisajes_favorites_'+new Date().toISOString().slice(0,10)+'.csv',[['id','region','framing','file'].map(q).join(',')].concat(ids.map(i=>{const x=item(i);return [x.id,x.region,x.encuadre,x.archivo].map(q).join(',');})).join('\n'),'text/csv');};
  if(keyOpen)$('#keybox').open=true;
  $('#filters').querySelectorAll('details.fg').forEach(d=>d.addEventListener('toggle',()=>{d.open?OPEN.add(d.dataset.fk):OPEN.delete(d.dataset.fk);}));
  $('#filters').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const s=F[c.dataset.k];s.has(c.dataset.v)?s.delete(c.dataset.v):s.add(c.dataset.v);renderFilters();renderGrid();});
  const ep=$('#eprin');if(ep)ep.onchange=()=>{elemPrincipal=ep.checked;renderGrid();};
  $('#openkey').onclick=e=>{e.preventDefault();e.stopPropagation();const k=$('#keybox');k.open=true;k.scrollIntoView({block:'start',behavior:'smooth'});};
  $('#keyglos').onclick=e=>{e.preventDefault();showTab('glos');window.scrollTo({top:0});};
}
function pass(x){
  for(const f of FIELDS){if(!F[f.k].size)continue;let vals=fget(f,x);if(f.k==='elemento'&&elemPrincipal)vals=[x.elemento_1];if(!vals.some(v=>F[f.k].has(v)))return false;}
  if(F.editado.size&&!store.ediciones[x.id])return false;
  if(F.fav.size&&!store.favs[x.id])return false;
  const q=$('#q').value.trim().toLowerCase();
  if(q&&!([x.id,x.sujeto,x.sujeto_en,x.estructura,x.estructura_en,x.original,x.nota,x.nota_en,x.etiquetas_previas].join(' ').toLowerCase().includes(q)))return false;
  return true;
}

const LISTS={sug:[],mios:[]};
const PSORT={sug:[['num','ps_num'],['thread','ps_thread'],['status','ps_status'],['fav','ps_fav'],['hue','ps_hue'],['light','ps_light'],['dark','ps_dark']],
  mios:[['new','ps_new'],['old','ps_old'],['name','ps_name'],['status','ps_status'],['fav','ps_fav'],['hue','ps_hue'],['light','ps_light'],['dark','ps_dark']]};
function fillSort(sel,ctx){const cur=store.sort[ctx]||PSORT[ctx][0][0];sel.innerHTML=PSORT[ctx].map(([v,k])=>`<option value="${v}">${t(k)}</option>`).join('');sel.value=cur;}
const PCOL={};
function pc(p){const key=p.id+p.anclas.join();if(PCOL[key])return PCOL[key];
  let L=0,sx=0,sy=0,w=0;const xs=p.anclas.map(item);
  xs.forEach(x=>{const [r,g,b]=rgbOf(x.color_medio);L+=0.2126*r+0.7152*g+0.0722*b;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),c=mx-mn;
    if(c>0.04){let H;if(mx===r)H=((g-b)/c)%6;else if(mx===g)H=(b-r)/c+2;else H=(r-g)/c+4;H=(H*60+360)%360;sx+=Math.cos(H*Math.PI/180)*c;sy+=Math.sin(H*Math.PI/180)*c;w+=c;}});
  return PCOL[key]={L:L/xs.length,H:w?((Math.atan2(sy,sx)*180/Math.PI)+360)%360:400};}
function sortPanels(list,mode){
  const idx=new Map(list.map((p,i)=>[p,i])),by=f=>list.slice().sort((a,b)=>f(a,b)||idx.get(a)-idx.get(b)),
    stt=p=>EST.indexOf((store.estados[p.id]||{}).estado||'por probar'),fv=p=>(store.estados[p.id]||{}).fav?0:1,nm=p=>String(p.nombre||p.id);
  switch(mode){
    case 'old':return list.slice().reverse();
    case 'thread':return by((a,b)=>String(vl('hilo',a.hilo)).localeCompare(String(vl('hilo',b.hilo)),LANG));
    case 'name':return by((a,b)=>nm(a).localeCompare(nm(b),LANG,{numeric:true}));
    case 'status':return by((a,b)=>stt(a)-stt(b));
    case 'fav':return by((a,b)=>fv(a)-fv(b));
    case 'hue':return by((a,b)=>pc(a).H-pc(b).H);
    case 'light':return by((a,b)=>pc(b).L-pc(a).L);
    case 'dark':return by((a,b)=>pc(a).L-pc(b).L);
    default:return list;
  }
}

const GFIELD={'balance':'equilibrio','emphasis':'enfasis','rhythm':'ritmo','scale reading':'lectura_escala','line direction':'direccion','shape character':'caracter_forma','figure and ground':'figura_fondo','space':'espacio','form':'forma_cierre','value contrast':'contraste_valor','color scheme':'esquema_color','temperature':'temperatura','color family':'familia','chroma':'croma','value':'valor','design element':'elemento','natural structure':'estructura_nat','role in panels':'uso','framing':'encuadre'};
function renderGlossary(){
  const q=($('#gq').value||'').trim().toLowerCase();
  const list=G.filter(g=>!q||[g.en,g.es,g.den,g.des].join(' ').toLowerCase().includes(q));
  $('#gcount').textContent=`${list.length} ${t('gl_terms')}`;
  let h='';
  [['principle','gl_principles'],['element','gl_elements'],['catalog','gl_catalog']].forEach(([grp,lk])=>{
    const xs=list.filter(g=>g.g===grp);if(!xs.length)return;
    h+=`<div class="gl-h">${t(lk)}</div>`+xs.map(g=>{const fk=GFIELD[g.field];
      return `<div class="gl-item"><div class="gl-term">${esc(LANG==='en'?g.en:g.es)}<small>${esc(LANG==='en'?g.es:g.en)}</small></div><div><div class="gl-def">${esc(LANG==='en'?g.den:g.des)}</div><div class="gl-meta">${g.ch?t('gl_ch',g.ch):t('gl_cat')}${fk?` · ${t('gl_field')}: <a data-gf="${fk}">${esc(flab(FK[fk]))}</a>`:''}</div></div></div>`;}).join('');
  });
  $('#glist').innerHTML=h||`<div class="empty">—</div>`;
}
$('#gq').addEventListener('input',renderGlossary);

/* ---------- random combinations ---------- */
const THREADS={elemento:['punto','línea','forma','textura','patrón'],principio:['equilibrio radial','patrón continuo','ritmo progresivo o fluido','escala ambigua','figura aislada'],
 estructura:['ramificada','reticulada','celular','concéntrica','estrellada','estratificada','fibrosa','granular','dispersa','lobulada'],
 color:['esquema complementario','esquema análogo','monocromático','colores cálidos','colores fríos']};
function threadTest(h){
  if(!h)return ()=>true;
  if(THREADS.elemento.includes(h))return x=>x.elemento_1===h||x.elemento_2===h;
  if(THREADS.estructura.includes(h))return x=>x.estructura_nat===h;
  return {'equilibrio radial':x=>x.equilibrio==='radial'||x.direccion==='radiante','patrón continuo':x=>x.equilibrio==='continuo','ritmo progresivo o fluido':x=>['progresivo','fluido'].includes(x.ritmo),
   'escala ambigua':x=>x.lectura_escala==='ambigua','figura aislada':x=>x.figura_fondo==='aislada','esquema complementario':x=>x.esquema_color==='complementario','esquema análogo':x=>x.esquema_color==='análogo',
   'monocromático':x=>x.esquema_color==='monocromático','colores cálidos':x=>x.temperatura==='cálida','colores fríos':x=>x.temperatura==='fría'}[h]||(()=>true);
}
function rgbOf(h){return [1,3,5].map(k=>parseInt(h.slice(k,k+2),16)/255);}
function ringScore(r){let s=0;for(let i=0;i<r.length;i++){const a=r[i],b=r[(i+1)%r.length];s+=2*(a.region!==b.region)+(scaleOf(a)!==scaleOf(b))+0.7*(a.direccion===b.direccion);const ca=rgbOf(a.color_medio),cb=rgbOf(b.color_medio);s-=0.6*Math.hypot(ca[0]-cb[0],ca[1]-cb[1],ca[2]-cb[2]);}return s;}
function perms(a){if(a.length<2)return [a];return a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));}
function randomPanel(){
  const h=$('#rthread').value,test=threadTest(h);
  const locks=store.borradorLocks||[];
  const slots=[0,1,2,3].map(i=>locks[i]&&store.borrador[i]?store.borrador[i]:null);
  const fixed=slots.filter(Boolean).map(item);
  let pool=all().filter(x=>x.encuadre!=='referencia'&&!slots.includes(x.id));
  if($('#ranchor').checked)pool=pool.filter(x=>x.uso==='ancla');
  if($('#rfilters').checked)pool=pool.filter(pass);
  pool=pool.filter(test);
  const need=4-fixed.length;if(pool.length<need){toast(t('r_none'));return;}
  const ok=(c,level)=>{const regs=new Set(c.map(x=>x.region)),sc=new Set(c.map(scaleOf)),fams=new Set(c.map(x=>x.familia_sujeto));
    if(level>=1&&regs.size<2)return false;if(level>=2&&!(sc.has('micro')&&sc.has('macro')&&sc.has('paisaje')))return false;if(level>=3&&fams.size<3)return false;return true;};
  let pick=null;
  for(const level of [3,2,1,0]){
    for(let n=0;n<4000&&!pick;n++){const s=new Set();while(s.size<need)s.add(pool[Math.floor(Math.random()*pool.length)]);const c=[...fixed,...s];if(ok(c,level))pick=[...s];}
    if(pick)break;}
  if(!pick){toast(t('r_none'));return;}
  const free=[0,1,2,3].filter(i=>!slots[i]);let best=null;
  for(const p of perms(pick)){const r=slots.map(id=>id?item(id):null);free.forEach((i,k)=>r[i]=p[k]);const sc=ringScore(r);if(!best||sc>best[0])best=[sc,r];}
  store.borrador=best[1].map(x=>x.id);store.borradorLocks=[0,1,2,3].map(i=>!!slots[i]);
  store.borradorNombre=(h?vl('hilo',h):t('r_any'))+' · '+new Date().toLocaleTimeString(LANG,{hour:'2-digit',minute:'2-digit'});$('#bname').value='';
  save();renderBuilder();toast(t('r_done'));
}
$('#rgo').onclick=randomPanel;

/* ---------- full-resolution download ---------- */
let DIRH=null,FILEMAP=null;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('interpaisajes',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}catch(e){return null;}}
async function idbSet(k,v){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').put(v,k);}catch(e){}}
async function cachedRoot(){
  if(DIRH)return DIRH;
  const h=await idbGet('catalogo');
  if(h){try{let p=await h.queryPermission({mode:'read'});if(p!=='granted')p=await h.requestPermission({mode:'read'});if(p==='granted')return DIRH=h;}catch(e){}}
  return null;
}
async function fileFromHandle(root,path){
  const parts=path.split('/');
  const tries=[parts,parts[0]==='imagenes'?parts.slice(1):null,['catalogo',...parts]].filter(Boolean);
  for(const segs of tries){try{let d=root;for(const s of segs.slice(0,-1))d=await d.getDirectoryHandle(s);return await (await d.getFileHandle(segs[segs.length-1])).getFile();}catch(e){}}
  return null;
}
async function getFile(path){
  const name=path.split('/').pop();
  if(FILEMAP){if(FILEMAP[name])return FILEMAP[name];const st=name.replace(/\.[^.]+$/,'').toLowerCase();for(const k in FILEMAP)if(k.replace(/\.[^.]+$/,'').toLowerCase()===st)return FILEMAP[k];}
  const root=window.showDirectoryPicker?await cachedRoot():null;
  return root?await fileFromHandle(root,path):null;
}
function askSource(p){
  return new Promise((res,rej)=>{
    const d=$('#srcdlg'),need=p.anclas.map(i=>item(i).archivo.split('/').pop().replace(/\.[^.]+$/,'.jpg'));let done=false;
    d.innerHTML=`<div class="srcbox"><h3>${t('src_title')}</h3><p>${t('src_body')}</p>${location.protocol==='file:'?`<p class="help">${t('src_local')}</p>`:''}${window.showDirectoryPicker?`<button class="btn" data-s="dir">${t('src_dir')}</button>`:''}<button class="btn" data-s="folder">${t('src_folder')}</button><button class="btn" data-s="files">${t('src_files')}</button><p class="help">${t('src_need')} ${need.map(esc).join(', ')}</p><p class="srcmsg" id="srcmsg"></p><button class="btn small" data-s="cancel">${t('src_cancel')}</button></div>`;
    const fin=ok=>{if(done)return;done=true;if(d.open)d.close();ok?res():rej(new Error('cancel'));};
    const pick=dirMode=>{const i=document.createElement('input');i.type='file';i.multiple=true;if(dirMode)i.webkitdirectory=true;else i.accept='image/*,.png,.jpg,.jpeg,.tif,.tiff';i.style.display='none';document.body.appendChild(i);
      i.onchange=()=>{FILEMAP=FILEMAP||{};for(const f of i.files)FILEMAP[f.name]=f;i.remove();fin(true);};i.oncancel=()=>i.remove();i.click();};
    d.onclick=async e=>{if(e.target===d){fin(false);return;}const b=e.target.closest('[data-s]');if(!b)return;const a=b.dataset.s;
      if(a==='cancel')fin(false);if(a==='folder')pick(true);if(a==='files')pick(false);
      if(a==='dir'){try{const h=await window.showDirectoryPicker({id:'interpaisajes',mode:'read'});await idbSet('catalogo',h);DIRH=h;fin(true);}catch(err){$('#srcmsg').textContent=t('src_blocked');}}};
    d.onclose=()=>{if(!done){done=true;rej(new Error('cancel'));}};
    d.showModal();
  });
}
function safeName(s){return String(s).normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)||'panel';}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}
async function downloadPanel(p){
  try{
    toast(t('dl_wait'));
    const load=async()=>{const out=[];for(let i=0;i<p.anclas.length;i++){const x=item(p.anclas[i]);const f=await getFile(x.archivo);if(!f)return {miss:x};out.push({name:String(i+1).padStart(2,'0')+'_'+(f.name||x.archivo.split('/').pop()),file:f,x});}return {out};};
    const dlPath=x=>'descargas/'+x.archivo.replace(/^imagenes\//,'').replace(/\.[^.\/]+$/,'.jpg');
    const nm=(i,x)=>String(i+1).padStart(2,'0')+'_'+dlPath(x).split('/').pop();
    let r=null;
    if(location.protocol!=='file:')try{const out=[];for(let i=0;i<p.anclas.length;i++){const x=item(p.anclas[i]);const rs=await fetch(dlPath(x));if(!rs.ok)throw new Error(rs.status);out.push({name:nm(i,x),file:await rs.blob(),x});}r={out};}catch(e){r=null;}
    if(!r)r=await load();
    if(r.miss){await askSource(p);r=await load();}
    if(r.miss){toast(t('dl_missing',r.miss.archivo.split('/').pop()));return;}
    const files=r.out;
    const folder=safeName(p.nombre||p.id);
    const info=[`${p.nombre||p.id}`,'',...files.map(f=>`${f.name}\t${f.x.region}\t${f.x.encuadre}\t${f.x.sujeto_en}`),...(haikuOf(p)?['',haikuOf(p)]:[])].join('\n');
    if(window.JSZip){const z=new JSZip(),d=z.folder(folder);files.forEach(f=>d.file(f.name,f.file));d.file('00_panel.txt',info);
      const blob=await z.generateAsync({type:'blob',compression:'STORE'});saveBlob(blob,folder+'.zip');}
    else{for(const f of files){saveBlob(f.file,f.name);await new Promise(r=>setTimeout(r,500));}}
    toast(t('dl_done'));
  }catch(e){console.warn(e);toast(t('dl_fail'));}
}

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

  (d.paneles||[]).forEach(p=>{if(!store.paneles.some(q=>q.id===p.id))store.paneles.push(p);});
  for(const [k,v] of Object.entries(d.estados||{}))store.estados[k]=Object.assign(store.estados[k]||{},v);
  store.favs=Object.assign(store.favs||{},d.favs||{});

const HELP={en:{title:'How to use this catalog',intro:'Explore the images, build panels of four anchors that close as a ring, and download them.',list:`<li>${hic('corpus')}<div><b>Corpus</b><span>Filter and search the images. Click one to see its record. Press ☆ to mark a favorite and “+ panel” to add it to your panel.</span></div></li><li>${hic('sug')}<div><b>Suggested panels</b><span>88 ready combinations. Click a name to see the four images side by side.</span></div></li><li>${hic('mine')}<div><b>My panels</b><span>Choose four anchors, or press “Random combination”. Lock 🔒 what you want to keep, then save.</span></div></li><li>${hic('dl')}<div><b>Download</b><span>Each panel downloads as four images numbered 01_ to 04_.</span></div></li><li>${hic('glos')}<div><b>Glossary</b><span>What the design terms in the labels mean.</span></div></li><li>${hic('save')}<div><b>Save and share</b><span>Favorites, notes and panels stay in this browser. Use “Export changes” and “Import” to share them.</span></div></li>`,ok:'Got it'},es:{title:'Cómo usar este catálogo',intro:'Explora las imágenes, arma paneles de cuatro anclas que cierran como un anillo y descárgalos.',list:`<li>${hic('corpus')}<div><b>Corpus</b><span>Filtra y busca imágenes. Un clic abre su ficha. Pulsa ☆ para marcar una favorita y “+ panel” para añadirla a tu panel.</span></div></li><li>${hic('sug')}<div><b>Paneles sugeridos</b><span>88 combinaciones listas. Un clic en el nombre muestra las cuatro imágenes una al lado de otra.</span></div></li><li>${hic('mine')}<div><b>Mis paneles</b><span>Elige cuatro anclas o pulsa “Combinación aleatoria”. Bloquea 🔒 lo que quieras conservar y guarda.</span></div></li><li>${hic('dl')}<div><b>Descargar</b><span>Cada panel se descarga como cuatro imágenes numeradas de 01_ a 04_.</span></div></li><li>${hic('glos')}<div><b>Glosario</b><span>Qué significan los términos de diseño de las etiquetas.</span></div></li><li>${hic('save')}<div><b>Guardar y compartir</b><span>Las favoritas, notas y paneles quedan en este navegador. Usa “Exportar cambios” e “Importar” para compartirlos.</span></div></li>`,ok:'Entendido'}};
function openHelp(){const h=HELP[LANG]||HELP.en,d=$('#helpdlg');d.innerHTML=`<div class="helpbox"><div class="helphead"><span class="hic">${hic('info',26)}</span><h2>${h.title}</h2><div class="lang"><button data-hl="en" class="${LANG==='en'?'on':''}">EN</button><button data-hl="es" class="${LANG==='es'?'on':''}">ES</button></div><button class="btn small" data-h="x" aria-label="Close">✕</button></div><div class="helpbody"><p>${h.intro}</p><ul class="hlist">${h.list}</ul></div><div class="helpfoot"><button class="btn" data-h="x">${h.ok}</button></div></div>`;d.onclick=e=>{const l=e.target.closest('[data-hl]');if(l){LANG=l.dataset.hl;try{localStorage.setItem(KEY+'_lang',LANG);}catch(er){}applyLang();openHelp();return;}if(e.target===d||e.target.closest('[data-h]'))d.close();};d.onclose=()=>{try{localStorage.setItem(KEY+'_help','1');}catch(e){}};if(!d.open)d.showModal();}
$('#helpbtn').onclick=openHelp;
try{if(!localStorage.getItem(KEY+'_help'))setTimeout(openHelp,400);}catch(e){setTimeout(openHelp,400);}
applyLang();
try{const tb=localStorage.getItem(KEY+'_tab');if(tb&&document.getElementById(tb))showTab(tb);}catch(e){}
})();
